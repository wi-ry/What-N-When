name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node.js checks and tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax checks
        run: npm run check

      - name: Frontend unit tests
        run: npm test

      - name: PR title lint
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit message lint
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  rust:
    name: Rust unit tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: rust-tests

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust compilation check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  dotnet:
    name: Windows widget provider tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Windows widget provider unit tests
        run: dotnet test src-tauri/widget-provider.Tests/WhatNWhenWidgetProvider.Tests.csproj --configuration Release

  build:
    name: Build Windows app
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: windows-build

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app for pull request validation
        if: github.event_name == 'pull_request'
        run: npm run build -- --no-bundle

      - name: Build Tauri app and installers
        if: github.event_name == 'push'
        run: npm run build

      - name: Package MSIX
        shell: pwsh
        run: .github\scripts\package-msix.ps1

      - name: Upload build artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msix/*.msix
          if-no-files-found: error

  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs:
      - node
      - rust
      - dotnet
      - build
    if: always()

    steps:
      - name: Verify all CI jobs passed
        env:
          NODE_RESULT: ${{ needs.node.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          DOTNET_RESULT: ${{ needs.dotnet.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$NODE_RESULT" != "success" ] ||
             [ "$RUST_RESULT" != "success" ] ||
             [ "$DOTNET_RESULT" != "success" ] ||
             [ "$BUILD_RESULT" != "success" ]; then
            echo "CI failed: node=$NODE_RESULT rust=$RUST_RESULT dotnet=$DOTNET_RESULT build=$BUILD_RESULT"
            exit 1
          fi

          echo "All CI jobs passed."
