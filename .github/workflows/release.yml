name: Semantic Release

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      tag: ${{ steps.semantic.outputs.new_release_git_tag }}
      version: ${{ steps.semantic.outputs.new_release_version }}
      notes: ${{ steps.semantic.outputs.new_release_notes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Run semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: |
            conventional-changelog-conventionalcommits@9.3.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
  build-and-upload:
    needs: release
    if: ${{ needs.release.outputs.published == 'true' }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Sync Tauri app version
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $config.version = "${{ needs.release.outputs.version }}"
          $config | ConvertTo-Json -Depth 32 | Set-Content src-tauri/tauri.conf.json

      - name: Build Tauri app
        run: npm run build

      - name: Package MSIX
        shell: pwsh
        run: .github/scripts/package-msix.ps1

      - name: Prepare portable executable
        shell: pwsh
        run: |
          Copy-Item `
            "src-tauri/target/release/what-n-when.exe" `
            "src-tauri/target/release/What-N-When_${{ needs.release.outputs.version }}_x64-portable.exe"

      - name: Upload artifact to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/What-N-When_${{ needs.release.outputs.version }}_x64-portable.exe

      - name: Setup MSStore CLI
        uses: microsoft/setup-msstore-cli@v1

      - name: Configure MSStore CLI
        run: |
          msstore reconfigure `
            --tenantId ${{ secrets.TENANT_ID }} `
            --sellerId ${{ secrets.SELLER_ID }} `
            --clientId ${{ secrets.CLIENT_ID }} `
            --clientSecret ${{ secrets.SECRET_VALUE }}

      - name: Publish to Store
        shell: pwsh
        env:
          RELEASE_NOTES: ${{ needs.release.outputs.notes }}
          STORE_ID: ${{ secrets.STORE_ID }}
        run: |
          $msix = Get-ChildItem -Path src-tauri/target/release/bundle/msix -Filter *.msix | Select-Object -First 1

          # 1. Upload the package, leave the submission as a draft
          msstore publish $msix.FullName -id $env:STORE_ID --noCommit -v --uploadTimeout 300

          # 2. Turn the markdown notes into plain text that fits the Store limit
          $notes = $env:RELEASE_NOTES
          $notes = $notes -replace '\[([^\]]+)\]\([^)]+\)', '$1'   # [text](url) -> text
          $notes = $notes -replace '\s*\([0-9a-f]{7,}\)', ''       # drop "(abc1234)" commit refs
          $notes = $notes -replace '(?m)^#+\s*', ''                # drop heading markers
          $notes = $notes -replace '\*\*', ''                      # drop bold markers
          $notes = $notes.Trim()
          if ($notes.Length -gt 1500) { $notes = $notes.Substring(0, 1497) + '...' }

          # 3. Set the notes on every locale's listing (no -v here, so the output stays valid JSON)
          $submission = msstore submission get $env:STORE_ID | ConvertFrom-Json
          foreach ($locale in $submission.Listings.PSObject.Properties) {
            $locale.Value.BaseListing.ReleaseNotes = $notes
          }
          msstore submission update $env:STORE_ID ($submission | ConvertTo-Json -Depth 100 -Compress)

          # 4. Commit and wait
          msstore submission publish $env:STORE_ID
          msstore submission poll $env:STORE_ID
