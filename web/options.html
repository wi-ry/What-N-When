<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Widget Options</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Segoe UI Variable', 'Segoe UI', sans-serif;
      background: #1a1a1a;
      color: #d6d6d6;
      padding: 24px;
      overflow-x: hidden;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    header {
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: 21px;
      font-weight: 600;
    }

    .subtitle {
      margin: 5px 0 0;
      color: #9a9a9a;
      font-size: 13px;
      line-height: 1.4;
    }

    .settings-group {
      border: 1px solid #2d2d2d;
      border-radius: 8px;
      padding: 16px;
      background: #202020;
    }

    .settings-group + .settings-group {
      margin-top: 12px;
    }

    .group-title {
      margin: 0 0 12px;
      color: #f0f0f0;
      font-size: 13px;
      font-weight: 600;
    }

    .setting {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 0;
      cursor: pointer;
      user-select: none;
    }

    .setting:first-of-type { padding-top: 0; }
    .setting:last-child { padding-bottom: 0; }
    .setting + .setting { border-top: 1px solid #303030; }

    input[type='checkbox'] {
      flex: 0 0 auto;
      width: 17px;
      height: 17px;
      margin: 1px 0 0;
      accent-color: #4f9dff;
      cursor: pointer;
    }

    .mode-picker {
      display: flex;
      width: fit-content;
      margin: 10px 0 0;
      overflow: hidden;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
    }

    .mode-picker label {
      cursor: pointer;
    }

    .mode-picker input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .mode-picker span {
      display: block;
      min-width: 126px;
      padding: 7px 12px;
      color: #bdbdbd;
      font-size: 12px;
      text-align: center;
    }

    .mode-picker label + label { border-left: 1px solid #3a3a3a; }
    .mode-picker input:checked + span { background: #1f5bbf; color: #fff; }
    .mode-picker.is-disabled { opacity: 0.45; pointer-events: none; }

    .setting-copy { min-width: 0; }

    .setting-title {
      color: #e4e4e4;
      font-size: 14px;
      line-height: 1.35;
    }

    .setting-description {
      margin: 3px 0 0;
      color: #9a9a9a;
      font-size: 12px;
      line-height: 1.4;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: auto;
      padding-top: 20px;
    }

    button {
      border: 1px solid #3a3a3a;
      background: #2a2a2a;
      color: #d6d6d6;
      border-radius: 6px;
      min-width: 98px;
      height: 32px;
      cursor: pointer;
    }

    button:hover {
      background: #353535;
    }

    #save-btn {
      background: #1f5bbf;
      border-color: #1f5bbf;
      color: #fff;
    }

    #save-btn:hover {
      background: #2a6fdc;
    }

    #test-toggle-btn {
      margin-right: auto;
      min-width: 120px;
    }

    #status {
      min-height: 18px;
      margin-top: 8px;
      color: #9ad39f;
      font-size: 12px;
      text-align: right;
    }

    .listener-debug {
      margin-top: 12px;
      padding: 12px;
      border: 1px solid #374453;
      border-radius: 6px;
      background: #1c2229;
    }

    .listener-debug summary {
      cursor: pointer;
      color: #bcd6f0;
      font-size: 12px;
      user-select: none;
    }

    #listener-debug-output {
      margin: 10px 0 0;
      color: #c8d0d9;
      font-family: Consolas, 'Courier New', monospace;
      font-size: 11px;
      line-height: 1.55;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <header>
    <h1>Widget Options</h1>
    <p class="subtitle">Choose how the calendar widget starts and responds on your desktop.</p>
  </header>

  <section class="settings-group" aria-labelledby="window-settings-title">
    <h2 class="group-title" id="window-settings-title">Window</h2>
    <label class="setting" for="remember-bounds">
      <input type="checkbox" id="remember-bounds">
      <span class="setting-copy">
        <span class="setting-title">Remember size and location</span>
        <span class="setting-description">Restore the widget where you last placed it.</span>
      </span>
    </label>
    <label class="setting" for="open-at-login">
      <input type="checkbox" id="open-at-login">
      <span class="setting-copy">
        <span class="setting-title">Launch at sign-in</span>
        <span class="setting-description">Open the widget automatically when you log in to Windows.</span>
      </span>
    </label>
  </section>

  <section class="settings-group" aria-labelledby="interaction-settings-title">
    <h2 class="group-title" id="interaction-settings-title">Interaction</h2>
    <label class="setting" for="desktop-double-click">
      <input type="checkbox" id="desktop-double-click">
      <span class="setting-copy">
        <span class="setting-title">Toggle widget from the desktop</span>
        <span class="setting-description">Double-click an empty desktop area to toggle the widget.</span>
        <span class="mode-picker" id="desktop-toggle-mode" role="radiogroup" aria-label="Desktop double-click action">
          <label>
            <input type="radio" name="desktop-toggle-action" value="hide" checked>
            <span>Hide widget</span>
          </label>
          <label>
            <input type="radio" name="desktop-toggle-action" value="transparent">
            <span>Make transparent</span>
          </label>
        </span>
      </span>
    </label>
  </section>

  <details class="listener-debug debug-only" open hidden>
    <summary>Desktop listener diagnostics</summary>
    <output id="listener-debug-output">Checking listener status...</output>
  </details>

  <div class="actions">
    <button class="debug-only" id="test-toggle-btn" type="button" hidden>Test Toggle Now</button>
    <button id="reset-btn" type="button">Reset Options</button>
    <button id="cancel-btn" type="button">Cancel</button>
    <button id="save-btn" type="button">Save</button>
  </div>

  <div id="status"></div>

  <script src="optionsRenderer.js"></script>
</body>
</html>
