<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' tauri: asset: http://asset.localhost; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    #app-shell {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
    }

    #titlebar {
      position: relative;
      height: 40px;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      padding: 0 5px 0 15px;
      flex-shrink: 0;
      /* Tauri uses data-tauri-drag-region attribute; -webkit-app-region still works in Tauri's WebView2 */
      user-select: none;
    }

    #title {
      position: absolute;
      left: 0;
      right: 0;
      text-align: center;
      pointer-events: none;
      color: #cccccc;
      font-family: 'Segoe UI Variable Display', 'Segoe UI Variable', 'Segoe UI', sans-serif;
      font-size: 14pt;
      font-weight: 600;
    }

    .btn {
      -webkit-app-region: no-drag; /* buttons override the drag region */
      border: none;
      background: none;
      color: #cccccc;
      width: 32px;
      height: 28px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 15px;
      font-family: 'Segoe UI Symbol', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
      transition: background 0.1s, color 0.1s;
    }

    .btn svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #options-btn { margin-left: auto; }

    .btn:hover { background: #333; }
    #close-btn:hover { background: #f15550; color: #fff; }

    #calendar-wrap {
      position: relative;
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      background: #1a1a1a;
    }

    .resize-handle {
      position: fixed;
      z-index: 9999;
      pointer-events: auto;
    }

    .resize-top { top: 0; left: 8px; right: 8px; height: 8px; cursor: ns-resize; }
    .resize-right { top: 8px; right: 0; bottom: 8px; width: 8px; cursor: ew-resize; }
    .resize-bottom { left: 8px; right: 8px; bottom: 0; height: 8px; cursor: ns-resize; }
    .resize-left { top: 8px; left: 0; bottom: 8px; width: 8px; cursor: ew-resize; }

    .resize-top-left { top: 0; left: 0; width: 10px; height: 10px; cursor: nwse-resize; }
    .resize-top-right { top: 0; right: 0; width: 10px; height: 10px; cursor: nesw-resize; }
    .resize-bottom-right { right: 0; bottom: 0; width: 10px; height: 10px; cursor: nwse-resize; }
    .resize-bottom-left { left: 0; bottom: 0; width: 10px; height: 10px; cursor: nesw-resize; }
  </style>
</head>
<body>
  <div class="resize-handle resize-top" data-edge="top"></div>
  <div class="resize-handle resize-right" data-edge="right"></div>
  <div class="resize-handle resize-bottom" data-edge="bottom"></div>
  <div class="resize-handle resize-left" data-edge="left"></div>

  <div class="resize-handle resize-top-left" data-edge="top-left"></div>
  <div class="resize-handle resize-top-right" data-edge="top-right"></div>
  <div class="resize-handle resize-bottom-right" data-edge="bottom-right"></div>
  <div class="resize-handle resize-bottom-left" data-edge="bottom-left"></div>

  <div id="app-shell">
    <div id="titlebar" data-tauri-drag-region>
      <span id="title">Notion Calendar</span>
      <button class="btn" id="options-btn" title="Options">
        <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.14.6.62 1.08 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
      </button>
      <button class="btn" id="refresh-btn" title="Refresh">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button class="btn" id="close-btn" title="Close">
        <svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></svg>
      </button>
    </div>
    <div id="calendar-wrap"></div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
